<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Змейка</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #1a1a2e;
    font-family: sans-serif;
    color: #eee;
  }
  h1 { margin-bottom: 10px; letter-spacing: 2px; }
  .info {
    display: flex;
    gap: 30px;
    margin-bottom: 10px;
    font-size: 18px;
  }
  .info span b { color: #4ecca3; }
  canvas {
    background: #16213e;
    border: 2px solid #4ecca3;
    border-radius: 6px;
    box-shadow: 0 0 20px rgba(78,204,163,0.3);
  }
  #status { margin-top: 10px; font-size: 16px; min-height: 20px; color: #4ecca3; }
  #hint { margin-top: 4px; font-size: 13px; color: #888; }
  .btn { display: none; }
</style>
</head>
<body>
  <h1>ЗМЕЙКА</h1>
  <div class="info">
    <span>Счёт: <b id="score">0</b></span>
    <span>Лучший: <b id="best">0</b></span>
  </div>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="status">Нажмите Пробел или кликните по полю, чтобы начать</div>
  <div id="hint">Управление: стрелки / WASD &mdash; движение, Пробел &mdash; пауза</div>
  <button id="restart" class="btn"></button>

<script>
(function () {
  const CELL = 20;
  const COLS = 20;
  const ROWS = 20;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const statusEl = document.getElementById('status');
  const restartBtn = document.getElementById('restart');

  let snake, dir, nextDir, food, score, best, running, paused, gameOver, tick;
  best = Number(localStorage.getItem('snakeBest')) || 0;
  bestEl.textContent = best;

  function reset() {
    const midX = Math.floor(COLS / 2);
    const midY = Math.floor(ROWS / 2);
    snake = [{x: midX, y: midY}, {x: midX - 1, y: midY}, {x: midX - 2, y: midY}];
    dir = {x: 1, y: 0};
    nextDir = dir;
    score = 0;
    gameOver = false;
    paused = false;
    running = false;
    scoreEl.textContent = score;
    spawnFood();
    draw();
  }

  function spawnFood() {
    let pos;
    do {
      pos = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function step() {
    if (!running || paused || gameOver) return;
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    const hitWall = head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS;
    const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);

    if (hitWall || hitSelf) {
      endGame();
      return;
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      spawnFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function endGame() {
    running = false;
    gameOver = true;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('snakeBest', best);
    }
    statusEl.textContent = 'Игра окончена! Счёт: ' + score + '. Нажмите Пробел для новой игры';
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#e94560';
    ctx.fillRect(food.x * CELL + 1, food.y * CELL + 1, CELL - 2, CELL - 2);

    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? '#4ecca3' : '#3aa88a';
      ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
    });
  }

  function togglePause() {
    if (!running || gameOver) return;
    paused = !paused;
    statusEl.textContent = paused ? 'Пауза. Нажмите Пробел для продолжения' : '';
  }

  function start() {
    if (gameOver) { reset(); }
    if (!running || paused) {
      running = true;
      paused = false;
      statusEl.textContent = '';
    }
  }

  function toggleStart() {
    if (!running) {
      start();
    } else {
      togglePause();
    }
  }

  canvas.addEventListener('click', toggleStart);

  window.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    const mapping = {
      arrowup: {x: 0, y: -1},
      arrowdown: {x: 0, y: 1},
      arrowleft: {x: -1, y: 0},
      arrowright: {x: 1, y: 0},
      w: {x: 0, y: -1},
      s: {x: 0, y: 1},
      a: {x: -1, y: 0},
      d: {x: 1, y: 0}
    };
    if (mapping[key]) {
      e.preventDefault();
      const d = mapping[key];
      if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
      start();
    } else if (key === ' ') {
      e.preventDefault();
      toggleStart();
    }
  });

  reset();
  tick = setInterval(step, 120);
})();
</script>
</body>
</html>
