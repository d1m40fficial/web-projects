<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Звёздное небо</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<script>
(() => {
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, stars = [];
  const REPEL_RADIUS = 170;
  const REPEL_POWER = 2.2;

  const COLORS = [
    [255, 255, 255],
    [205, 222, 255],
    [170, 195, 255],
    [255, 242, 214],
    [255, 214, 196],
    [235, 235, 255]
  ];

  function makeSprite(radius, color) {
    const halo = radius * 7;
    const size = Math.max(8, Math.ceil(halo * 2));
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g2 = c.getContext('2d');
    const cx = size / 2, cy = size / 2;

    const grad = g2.createRadialGradient(cx, cy, 0, cx, cy, cx);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.08, `rgba(${color[0]},${color[1]},${color[2]},0.95)`);
    grad.addColorStop(0.22, `rgba(${color[0]},${color[1]},${color[2]},0.45)`);
    grad.addColorStop(0.5, `rgba(${color[0]},${color[1]},${color[2]},0.12)`);
    grad.addColorStop(1, `rgba(${color[0]},${color[1]},${color[2]},0)`);
    g2.fillStyle = grad;
    g2.fillRect(0, 0, size, size);

    return c;
  }

  function createStars() {
    stars = [];
    const count = Math.min(520, Math.floor(W * H / 3200));
    for (let i = 0; i < count; i++) {
      const big = Math.random() < 0.09;
      const r = big ? 2.2 + Math.random() * 2.3 : 0.5 + Math.pow(Math.random(), 2.2) * 1.7;
      const x = Math.random() * W;
      const y = Math.random() * H;
      const drifting = Math.random() < 0.3;
      const driftAngle = Math.random() * Math.PI * 2;
      const driftSpeed = drifting ? 1.5 + Math.random() * 5 : 0;
      stars.push({
        hx: x, hy: y, x, y,
        vx: 0, vy: 0,
        dvx: Math.cos(driftAngle) * driftSpeed,
        dvy: Math.sin(driftAngle) * driftSpeed,
        r,
        sprite: makeSprite(r, COLORS[(Math.random() * COLORS.length) | 0]),
        phase: Math.random() * Math.PI * 2,
        twinkle: 0.6 + Math.random() * 2.2,
        baseA: big ? 0.9 : 0.55 + Math.random() * 0.45,
        depth: 0.5 + Math.random() * 0.5
      });
    }
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    createStars();
  }

  let mx = -99999, my = -99999;
  window.addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; });
  window.addEventListener('pointerleave', () => { mx = my = -99999; });
  window.addEventListener('blur', () => { mx = my = -99999; });
  window.addEventListener('resize', resize);

  resize();

  let last = performance.now();
  function frame(now) {
    const t = now / 1000;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';

    for (const s of stars) {
      if (s.dvx || s.dvy) {
        s.hx += s.dvx * dt;
        s.hy += s.dvy * dt;
        const M = 30;
        if (s.hx < -M) { s.hx += W + M * 2; s.x += W + M * 2; }
        else if (s.hx > W + M) { s.hx -= W + M * 2; s.x -= W + M * 2; }
        if (s.hy < -M) { s.hy += H + M * 2; s.y += H + M * 2; }
        else if (s.hy > H + M) { s.hy -= H + M * 2; s.y -= H + M * 2; }
      }
      const dx = s.x - mx;
      const dy = s.y - my;
      const d2 = dx * dx + dy * dy;
      if (d2 < REPEL_RADIUS * REPEL_RADIUS && d2 > 0.01) {
        const d = Math.sqrt(d2);
        const k = (1 - d / REPEL_RADIUS);
        const f = k * k * REPEL_POWER * s.depth;
        s.vx += (dx / d) * f;
        s.vy += (dy / d) * f;
      }
      s.vx += (s.hx - s.x) * 0.018;
      s.vy += (s.hy - s.y) * 0.018;
      s.vx *= 0.88;
      s.vy *= 0.88;
      s.x += s.vx;
      s.y += s.vy;

      const tw = 1 - 0.28 * (0.5 + 0.5 * Math.sin(t * s.twinkle + s.phase));
      ctx.globalAlpha = s.baseA * tw;

      const sz = s.r * 14;
      ctx.drawImage(s.sprite, s.x - sz / 2, s.y - sz / 2, sz, sz);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
